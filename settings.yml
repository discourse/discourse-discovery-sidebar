sidebar_position:
  type: enum
  default: aside
  choices:
    - aside
    - below-navbar

# Where the space block appears and where its "All spaces" link goes. An entry
# scoped to categories applies on those categories and their subcategories;
# the unscoped entry everywhere else. With no unscoped entry the block only
# shows on the scoped categories.
spaces:
  type: objects
  default:
    - all_spaces_url: "/"
  schema:
    name: space
    identifier: categories
    properties:
      categories:
        type: categories
      all_spaces_url:
        type: enum
        default: "/"
        choices:
          - "/"
          - "/latest"
          - "/categories"

# Where the events block appears and which category its events come from. An
# entry scoped to categories applies on those categories and their
# subcategories; the unscoped entry everywhere else. No events category means
# the whole site.
events:
  type: objects
  default:
    - {}
  schema:
    name: events
    identifier: categories
    properties:
      categories:
        type: categories
      events_category:
        type: categories
        validations:
          max: 1

# Which topics the topics block lists for a space. An entry scoped to
# categories applies on those categories and their subcategories; the unscoped
# entry everywhere else. The order sorts the list; a tag narrows it to topics
# carrying it.
topic_lists:
  type: objects
  default:
    - order: hot
  schema:
    name: topic_list
    identifier: categories
    properties:
      categories:
        type: categories
      order:
        type: enum
        default: hot
        choices:
          - hot
          - activity
          - created
          - likes
          - views
          - posts
      tag:
        type: tags
        validations:
          max: 1

# Which gamification leaderboard the leaderboard block shows. An entry scoped
# to categories applies on those categories and their subcategories; the
# unscoped entry everywhere else. No id means the plugin's default leaderboard.
leaderboards:
  type: objects
  default:
    - {}
  schema:
    name: leaderboard
    identifier: categories
    properties:
      categories:
        type: categories
      leaderboard_id:
        type: integer
        validations:
          min: 1

# Which links the resources block lists. An entry scoped to categories applies
# on those categories and their subcategories; an unscoped entry everywhere else.
resources:
  type: objects
  default:
    - links:
        - label: "Community guidelines"
          url: "/guidelines"
          icon: "circle-check"
          description: "How we treat each other here"
        - label: "Badges"
          url: "/badges"
          icon: "certificate"
          description: "What you can earn by taking part"
        - label: "About this site"
          url: "/about"
          icon: "circle-info"
          description: "Key stats and how to get in touch"
  schema:
    name: resources
    identifier: categories
    properties:
      categories:
        type: categories
      links:
        type: objects
        schema:
          name: link
          identifier: label
          properties:
            label:
              type: string
              required: true
            url:
              type: string
              required: true
            icon:
              type: icon
            description:
              type: string
