sidebar_position:
  type: enum
  default: aside
  choices:
    - aside
    - below-navbar

# Each setting holds the instances of one block. Every entry renders one panel.
# Shared instance fields: placement, categories (scope), title, mobile.

space:
  type: objects
  default:
    - placement: discovery-sidebar
      mobile: true
      show_description: true
      show_topic_counts: true
  schema:
    name: space
    identifier: title
    properties:
      placement:
        type: enum
        required: true
        default: discovery-sidebar
        choices:
          - discovery-sidebar
          - none
      categories:
        type: categories
      title:
        type: string
      mobile:
        type: boolean
      show_description:
        type: boolean
      show_topic_counts:
        type: boolean

leaderboard:
  type: objects
  default:
    - placement: discovery-sidebar
      title: "Top contributors"
      title_icon: trophy
      count: 5
      period: monthly
  schema:
    name: leaderboard
    identifier: title
    properties:
      placement:
        type: enum
        required: true
        default: discovery-sidebar
        choices:
          - discovery-sidebar
          - none
      categories:
        type: categories
      title:
        type: string
      mobile:
        type: boolean
      leaderboard_id:
        type: integer
        validations:
          min: 0
      count:
        type: integer
        validations:
          min: 1
          max: 20
      period:
        type: enum
        required: true
        default: monthly
        choices:
          - all_time
          - yearly
          - quarterly
          - monthly
          - weekly
          - daily
      title_icon:
        type: icon

resources:
  type: objects
  default:
    - placement: discovery-sidebar
      title: "Resources"
      title_icon: book
      links:
        - label: "Community guidelines"
          url: "/guidelines"
          icon: "circle-check"
          description: "How we treat each other here"
        - label: "Badges"
          url: "/badges"
          icon: "certificate"
          description: "What you can earn by taking part"
        - label: "About this site"
          url: "/about"
          icon: "circle-info"
  schema:
    name: resources
    identifier: title
    properties:
      placement:
        type: enum
        required: true
        default: discovery-sidebar
        choices:
          - discovery-sidebar
          - none
      categories:
        type: categories
      title:
        type: string
        required: true
      mobile:
        type: boolean
      title_icon:
        type: icon
      links:
        type: objects
        schema:
          name: link
          identifier: label
          properties:
            label:
              type: string
              required: true
            url:
              type: string
              required: true
            icon:
              type: icon
            description:
              type: string
