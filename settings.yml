sidebar_position:
  type: enum
  default: aside
  choices:
    - aside
    - below-navbar

# Which gamification leaderboard the leaderboard block shows. An entry scoped
# to categories applies on those categories and their subcategories; the
# unscoped entry everywhere else. No id means the plugin's default leaderboard.
leaderboards:
  type: objects
  default:
    - {}
  schema:
    name: leaderboard
    identifier: categories
    properties:
      categories:
        type: categories
      leaderboard_id:
        type: integer
        validations:
          min: 1

# Which links the resources block lists. An entry scoped to categories applies
# on those categories and their subcategories; an unscoped entry everywhere else.
resources:
  type: objects
  default:
    - name: "Default"
      links:
        - label: "Community guidelines"
          url: "/guidelines"
          icon: "circle-check"
          description: "How we treat each other here"
        - label: "Badges"
          url: "/badges"
          icon: "certificate"
          description: "What you can earn by taking part"
        - label: "About this site"
          url: "/about"
          icon: "circle-info"
  schema:
    name: resources
    identifier: name
    properties:
      name:
        type: string
        required: true
      categories:
        type: categories
      links:
        type: objects
        schema:
          name: link
          identifier: label
          properties:
            label:
              type: string
              required: true
            url:
              type: string
              required: true
            icon:
              type: icon
            description:
              type: string
